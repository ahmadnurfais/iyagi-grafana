name: iyagi-grafana

services:
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: ${LOKI_CONTAINER_NAME:-iyagi-loki}
    hostname: loki
    restart: unless-stopped
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-8760h}
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki-data:/var/lib/loki
    networks:
      internal:
        aliases:
          - loki
      ingress:
        aliases:
          - loki
    ports:
      - "${LOKI_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-13100}:3100"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki-ready:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    container_name: iyagi-loki-ready
    restart: unless-stopped
    command: ["sh", "-c", "while sleep 3600; do :; done"]
    networks:
      - internal
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://loki:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: ${GRAFANA_CONTAINER_NAME:-iyagi-grafana}
    hostname: grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-data:/var/lib/grafana
    secrets:
      - grafana-admin-password
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    networks:
      internal:
        aliases:
          - grafana
    depends_on:
      loki-ready:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  grafana-admin-password:
    file: ./secrets/grafana-admin-password

networks:
  internal:
    name: ${GRAFANA_INTERNAL_NETWORK_NAME:-iyagi-grafana-internal}
  ingress:
    name: ${GRAFANA_INGRESS_NETWORK_NAME:-iyagi-grafana-ingress}
    external: true
